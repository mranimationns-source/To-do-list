<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>List & Task App</title>
  <style>
    :root {
      --bg-white: #FFFFFF;
      --border-light: #EFEFEF;
      --border-mid: #DBDBDB;
      --text-main: #121212;
      --text-muted: #6E6E6E;

      --pastel-pink: #FFE4E8;
      --pastel-pink-border: #F7C5CE;

      --pastel-blue: #E3F2FD;
      --pastel-blue-border: #BBDEFB;

      --pastel-yellow: #FFF9C4;
      --pastel-yellow-border: #FFF176;

      --pastel-lavender: #EDE7F6;
      --pastel-lavender-border: #D1C4E9;

      --pastel-mint: #E8F5E9;
      --pastel-mint-border: #C8E6C9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-white);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 84px;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--bg-white);
      padding: 14px 14px 20px;
    }

    /* Top Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 14px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 14px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .date-pill {
      background-color: var(--pastel-blue);
      border: 1px solid var(--pastel-blue-border);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* Quick Create Card */
    .quick-create-card {
      background-color: var(--pastel-pink);
      border: 1px solid var(--pastel-pink-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .quick-create-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .quick-create-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .quick-form {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-field {
      width: 100%;
      background-color: var(--bg-white);
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
    }

    .input-field:focus {
      border-color: #999999;
    }

    .btn-primary {
      background-color: var(--text-main);
      color: var(--bg-white);
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-secondary {
      background-color: var(--bg-white);
      color: var(--text-main);
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Remaining Summary Box */
    .remaining-banner {
      background-color: var(--pastel-blue);
      border: 1px solid var(--pastel-blue-border);
      border-radius: 16px;
      padding: 13px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .remaining-title {
      font-size: 14px;
      font-weight: 700;
    }

    .remaining-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .badge-count {
      background-color: var(--bg-white);
      border: 1px solid var(--border-mid);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Section Headings */
    .section-heading {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Lists Grid */
    .lists-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .list-tile {
      border-radius: 14px;
      padding: 13px;
      border: 1px solid var(--border-mid);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 98px;
      position: relative;
    }

    .list-tile.pastel-0 { background-color: var(--pastel-pink); border-color: var(--pastel-pink-border); }
    .list-tile.pastel-1 { background-color: var(--pastel-blue); border-color: var(--pastel-blue-border); }
    .list-tile.pastel-2 { background-color: var(--pastel-yellow); border-color: var(--pastel-yellow-border); }
    .list-tile.pastel-3 { background-color: var(--pastel-lavender); border-color: var(--pastel-lavender-border); }
    .list-tile.pastel-4 { background-color: var(--pastel-mint); border-color: var(--pastel-mint-border); }

    .list-tile-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .list-tile-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .urgent-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #E53935;
      position: absolute;
      top: 10px;
      right: 10px;
    }

    /* Empty State */
    .empty-state {
      border: 1px dashed var(--border-mid);
      border-radius: 16px;
      padding: 36px 18px;
      text-align: center;
      background-color: #FAFAFA;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Grouped Remaining Lists */
    .group-block {
      margin-bottom: 16px;
    }

    .group-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .group-card {
      background-color: var(--pastel-lavender);
      border: 1px solid var(--pastel-lavender-border);
      border-radius: 12px;
      padding: 11px 13px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    /* Add List Form View */
    .card-box {
      background-color: var(--pastel-yellow);
      border: 1px solid var(--pastel-yellow-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .item-row-input {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .qty-input {
      width: 92px;
      flex-shrink: 0;
    }

    /* Detail View */
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .task-item {
      background-color: var(--bg-white);
      border: 1px solid var(--border-mid);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .task-item.completed-item {
      background-color: var(--pastel-mint);
      border-color: var(--pastel-mint-border);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--text-main);
    }

    .task-name {
      font-size: 14px;
      font-weight: 500;
      word-break: break-word;
    }

    .task-item.completed-item .task-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-qty {
      font-size: 12px;
      color: var(--text-muted);
      background-color: #F5F5F5;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Notification Cards */
    .alert-card {
      background-color: var(--pastel-yellow);
      border: 1px solid var(--pastel-yellow-border);
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .alert-tag {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* Calendar View */
    .calendar-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .cal-dow {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 0;
    }

    .cal-day {
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background-color: var(--bg-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    .cal-day.empty {
      border: none;
      background: transparent;
      cursor: default;
    }

    .cal-day.selected {
      background-color: var(--pastel-pink);
      border-color: var(--pastel-pink-border);
    }

    .cal-day.has-list::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--text-main);
      margin-top: 2px;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 66px;
      background-color: var(--bg-white);
      border-top: 1px solid var(--border-mid);
      display: flex;
      align-items: center;
      justify-content: space-around;
      max-width: 480px;
      margin: 0 auto;
      z-index: 100;
      padding: 0 6px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      height: 100%;
    }

    .nav-btn.active {
      color: var(--text-main);
    }

    .nav-add-badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background-color: var(--pastel-pink);
      border: 1px solid var(--pastel-pink-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }

    .nav-date-text {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="app-title" id="headerTitle">All Lists</div>
      <button class="date-pill" id="headerTodayBtn" onclick="openTodayDate()">19 Nov</button>
    </div>

    <!-- VIEW 1: ALL LISTS -->
    <section id="view-all">
      <div class="quick-create-card">
        <div class="quick-create-title">Quick Create List</div>
        <div class="quick-create-sub">Add a new list name and open it to add items.</div>
        <form class="quick-form" onsubmit="quickCreateList(event)">
          <input type="text" id="quickListName" class="input-field" placeholder="Enter list name..." required />
          <button type="submit" class="btn-primary">Create</button>
        </form>
      </div>

      <div class="remaining-banner" onclick="switchTab('remaining')">
        <div>
          <div class="remaining-title">Remaining Lists</div>
          <div class="remaining-sub">Lists with uncompleted items</div>
        </div>
        <div class="badge-count" id="remainingCountBadge">0</div>
      </div>

      <div class="section-heading">
        <span>Your Lists</span>
      </div>

      <div id="allListsContainer"></div>
    </section>

    <!-- VIEW 2: REMAINING LISTS -->
    <section id="view-remaining" class="hidden">
      <div id="remainingGroupsContainer"></div>
    </section>

    <!-- VIEW 3: ADD LIST BUILDER -->
    <section id="view-add" class="hidden">
      <div class="card-box">
        <div class="quick-create-title" style="margin-bottom: 10px;">Add New List</div>

        <label style="display:block; font-size:12px; font-weight:600; margin-bottom:5px;">List Name</label>
        <input type="text" id="newListName" class="input-field" placeholder="e.g., Grocery, Study, Trip" style="margin-bottom:10px;" />

        <label style="display:block; font-size:12px; font-weight:600; margin-bottom:5px;">Date</label>
        <input type="date" id="newListDate" class="input-field" style="margin-bottom:10px;" />

        <label style="display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; margin-bottom:12px; cursor:pointer;">
          <input type="checkbox" id="newListLastDay" />
          Mark as "Today is the last day to complete it"
        </label>

        <div class="section-heading" style="margin-bottom:8px;">
          <span>Things (Name &amp; Optional Quantity)</span>
          <button type="button" class="btn-secondary" onclick="addBuilderItemRow()">+ Row</button>
        </div>

        <div id="builderItemsContainer"></div>

        <div style="display:flex; gap:8px; margin-top:12px;">
          <button type="button" class="btn-primary" style="flex:1;" onclick="saveNewList()">Save List</button>
          <button type="button" class="btn-secondary" onclick="switchTab('all')">Cancel</button>
        </div>
      </div>
    </section>

    <!-- VIEW 4: NOTIFICATIONS / LAST DAY -->
    <section id="view-notifications" class="hidden">
      <div class="section-heading">
        <span>Remaining &amp; Last Day Alerts</span>
      </div>
      <div id="notificationsContainer"></div>
    </section>

    <!-- VIEW 5: CALENDAR -->
    <section id="view-calendar" class="hidden">
      <div class="card-box" style="background-color: var(--pastel-blue); border-color: var(--pastel-blue-border);">
        <div class="calendar-controls">
          <select id="calYearSelect" class="input-field" onchange="renderCalendar()"></select>
          <select id="calMonthSelect" class="input-field" onchange="renderCalendar()"></select>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
      </div>

      <div class="section-heading">
        <span id="selectedDateLabel">Lists for Selected Date</span>
      </div>
      <div id="calendarDateListsContainer"></div>
    </section>

    <!-- VIEW 6: LIST DETAIL VIEW -->
    <section id="view-detail" class="hidden">
      <div class="detail-header">
        <button type="button" class="btn-secondary" onclick="goBackFromDetail()">← Back</button>
        <button type="button" class="btn-secondary" onclick="deleteCurrentList()" style="color:#C62828;">Delete List</button>
      </div>

      <div class="card-box" style="background-color: var(--pastel-lavender); border-color: var(--pastel-lavender-border); margin-bottom:14px;">
        <div id="detailListTitle" style="font-size:18px; font-weight:700;"></div>
        <div id="detailListDate" style="font-size:12px; color:var(--text-muted); margin-top:3px;"></div>
      </div>

      <form class="quick-form" style="margin-bottom:16px;" onsubmit="addItemToCurrentList(event)">
        <input type="text" id="detailNewItemName" class="input-field" placeholder="Add item name..." required />
        <input type="text" id="detailNewItemQty" class="input-field qty-input" placeholder="Qty (opt)" />
        <button type="submit" class="btn-primary">Add</button>
      </form>

      <div class="section-heading">
        <span>Incomplete</span>
      </div>
      <div id="detailIncompleteContainer" style="margin-bottom:16px;"></div>

      <div class="section-heading">
        <span>Complete</span>
      </div>
      <div id="detailCompleteContainer"></div>
    </section>
  </div>

  <!-- 5-Button Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-all" onclick="switchTab('all')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
      </svg>
      <span>All Lists</span>
    </button>

    <button class="nav-btn" id="nav-remaining" onclick="switchTab('remaining')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <path d="M9 12l2 2 4-4" />
      </svg>
      <span>Remaining</span>
    </button>

    <button class="nav-btn" id="nav-add" onclick="switchTab('add')" aria-label="Add List">
      <div class="nav-add-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <path d="M12 11v6M9 14h6" />
        </svg>
      </div>
    </button>

    <button class="nav-btn" id="nav-notifications" onclick="switchTab('notifications')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span>Alerts</span>
    </button>

    <button class="nav-btn" id="nav-calendar" onclick="switchTab('calendar')">
      <span class="nav-date-text" id="navDateLabel">19<br/>Nov</span>
    </button>
  </nav>

  <script>
    const STORAGE_KEY = "pastel_todo_lists_v1";
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    let lists = [];
    let currentTab = "all";
    let previousTab = "all";
    let activeListId = null;
    let selectedCalendarDate = getTodayISO();

    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getYesterdayISO() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatShortDate(iso) {
      if (!iso) return "";
      const parts = iso.split("-");
      if (parts.length !== 3) return iso;
      const day = parseInt(parts[2], 10);
      const monthName = MONTHS[parseInt(parts[1], 10) - 1] || "";
      return `${day} ${monthName}`;
    }

    function formatFullDate(iso) {
      if (!iso) return "";
      const parts = iso.split("-");
      if (parts.length !== 3) return iso;
      const day = parseInt(parts[2], 10);
      const monthName = MONTHS[parseInt(parts[1], 10) - 1] || "";
      return `${day} ${monthName} ${parts[0]}`;
    }

    function loadLists() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        lists = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(lists)) lists = [];
      } catch (e) {
        lists = [];
      }
    }

    function saveLists() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lists));
      updateBadges();
    }

    function hasIncompleteItems(list) {
      if (!list.items || list.items.length === 0) return true;
      return list.items.some((item) => !item.completed);
    }

    function updateBadges() {
      const remainingCount = lists.filter(hasIncompleteItems).length;
      const badge = document.getElementById("remainingCountBadge");
      if (badge) badge.textContent = remainingCount;
    }

    function setTodayLabels() {
      const todayISO = getTodayISO();
      const parts = todayISO.split("-");
      const day = parseInt(parts[2], 10);
      const month = MONTHS[parseInt(parts[1], 10) - 1];
      document.getElementById("headerTodayBtn").textContent = `${day} ${month}`;
      document.getElementById("navDateLabel").innerHTML = `${day}<br/>${month}`;
    }

    function openTodayDate() {
      selectedCalendarDate = getTodayISO();
      switchTab("calendar");
    }

    function switchTab(tabName) {
      if (tabName !== "detail") {
        previousTab = currentTab === "detail" ? "all" : currentTab;
      }
      currentTab = tabName;

      const views = ["all", "remaining", "add", "notifications", "calendar", "detail"];
      views.forEach((v) => {
        document.getElementById(`view-${v}`).classList.toggle("hidden", v !== tabName);
      });

      const navTabs = ["all", "remaining", "add", "notifications", "calendar"];
      navTabs.forEach((n) => {
        const btn = document.getElementById(`nav-${n}`);
        if (btn) btn.classList.toggle("active", n === tabName);
      });

      const titles = {
        all: "All Lists",
        remaining: "Remaining Lists",
        add: "Add List",
        notifications: "Alerts",
        calendar: "Calendar",
        detail: "List Details"
      };
      document.getElementById("headerTitle").textContent = titles[tabName] || "Lists";

      if (tabName === "all") renderAllLists();
      if (tabName === "remaining") renderRemainingLists();
      if (tabName === "add") resetAddForm();
      if (tabName === "notifications") renderNotifications();
      if (tabName === "calendar") initAndRenderCalendar();
      if (tabName === "detail") renderDetailView();
    }

    function renderAllLists() {
      const container = document.getElementById("allListsContainer");
      updateBadges();

      if (lists.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">No list yet</div>
            <div class="empty-sub">Create a list above or tap the list icon below to begin.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = `<div class="lists-grid" id="listsGridInner"></div>`;
      const grid = document.getElementById("listsGridInner");

      lists.forEach((list, idx) => {
        const total = list.items ? list.items.length : 0;
        const done = list.items ? list.items.filter((i) => i.completed).length : 0;
        const isRemaining = hasIncompleteItems(list);
        const card = document.createElement("div");
        card.className = `list-tile pastel-${idx % 5}`;
        card.onclick = () => openListDetail(list.id);
        card.innerHTML = `
          ${isRemaining ? `<span class="urgent-dot" title="Has incomplete items"></span>` : ""}
          <div class="list-tile-name">${escapeHTML(list.name)}</div>
          <div class="list-tile-meta">${done}/${total} done · ${formatShortDate(list.date)}</div>
        `;
        grid.appendChild(card);
      });
    }

    function quickCreateList(e) {
      e.preventDefault();
      const input = document.getElementById("quickListName");
      const name = input.value.trim();
      if (!name) return;

      const newList = {
        id: "list_" + Date.now(),
        name,
        date: getTodayISO(),
        lastDay: false,
        items: []
      };

      lists.unshift(newList);
      saveLists();
      input.value = "";
      openListDetail(newList.id);
    }

    function resetAddForm() {
      document.getElementById("newListName").value = "";
      document.getElementById("newListDate").value = selectedCalendarDate || getTodayISO();
      document.getElementById("newListLastDay").checked = false;
      const itemsBox = document.getElementById("builderItemsContainer");
      itemsBox.innerHTML = "";
      addBuilderItemRow();
    }

    function addBuilderItemRow() {
      const itemsBox = document.getElementById("builderItemsContainer");
      const row = document.createElement("div");
      row.className = "item-row-input";
      row.innerHTML = `
        <input type="text" class="input-field builder-item-name" placeholder="Item name..." />
        <input type="text" class="input-field qty-input builder-item-qty" placeholder="Qty" />
      `;
      itemsBox.appendChild(row);
    }

    function saveNewList() {
      const name = document.getElementById("newListName").value.trim();
      const date = document.getElementById("newListDate").value || getTodayISO();
      const lastDay = document.getElementById("newListLastDay").checked;

      if (!name) {
        alert("Please enter a list name.");
        return;
      }

      const names = document.querySelectorAll(".builder-item-name");
      const qtys = document.querySelectorAll(".builder-item-qty");
      const items = [];

      names.forEach((el, i) => {
        const itemName = el.value.trim();
        const itemQty = qtys[i] ? qtys[i].value.trim() : "";
        if (itemName) {
          items.push({
            id: "item_" + Date.now() + "_" + i,
            name: itemName,
            qty: itemQty,
            completed: false
          });
        }
      });

      const created = {
        id: "list_" + Date.now(),
        name,
        date,
        lastDay,
        items
      };

      lists.unshift(created);
      saveLists();
      switchTab("all");
    }

    function renderRemainingLists() {
      const container = document.getElementById("remainingGroupsContainer");
      const remaining = lists.filter(hasIncompleteItems);

      if (remaining.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">No remaining lists</div>
            <div class="empty-sub">All your lists are complete or no list is added yet.</div>
          </div>
        `;
        return;
      }

      const todayISO = getTodayISO();
      const yesterdayISO = getYesterdayISO();

      const groups = {
        Today: [],
        Yesterday: [],
        Other: {}
      };

      remaining.forEach((l) => {
        if (l.date === todayISO) groups.Today.push(l);
        else if (l.date === yesterdayISO) groups.Yesterday.push(l);
        else {
          const key = l.date || "No Date";
          if (!groups.Other[key]) groups.Other[key] = [];
          groups.Other[key].push(l);
        }
      });

      let html = "";

      if (groups.Today.length > 0) {
        html += renderGroupSection("Today", groups.Today);
      }
      if (groups.Yesterday.length > 0) {
        html += renderGroupSection("Yesterday", groups.Yesterday);
      }
      Object.keys(groups.Other).forEach((dateKey) => {
        html += renderGroupSection(formatFullDate(dateKey), groups.Other[dateKey]);
      });

      container.innerHTML = html;
    }

    function renderGroupSection(label, groupLists) {
      const cards = groupLists
        .map((l) => {
          const pendingCount = l.items.filter((i) => !i.completed).length;
          return `
            <div class="group-card" onclick="openListDetail('${l.id}')">
              <div>
                <div style="font-size:14px; font-weight:700;">${escapeHTML(l.name)}</div>
                <div style="font-size:11px; color:var(--text-muted);">${pendingCount} incomplete</div>
              </div>
              <span style="font-size:12px; font-weight:700;">→</span>
            </div>
          `;
        })
        .join("");

      return `
        <div class="group-block">
          <div class="group-label">${escapeHTML(label)}</div>
          ${cards}
        </div>
      `;
    }

    function renderNotifications() {
      const container = document.getElementById("notificationsContainer");
      const todayISO = getTodayISO();

      const alertLists = lists.filter(
        (l) => hasIncompleteItems(l) && (l.lastDay || l.date === todayISO)
      );

      if (alertLists.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">No urgent alerts</div>
            <div class="empty-sub">No lists marked for today or last day completion.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = alertLists
        .map(
          (l) => `
          <div class="alert-card" onclick="openListDetail('${l.id}')">
            <div class="alert-tag">Today is the last day to complete it</div>
            <div style="font-size:15px; font-weight:700;">${escapeHTML(l.name)}</div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
              ${l.items.filter((i) => !i.completed).length} items left · ${formatShortDate(l.date)}
            </div>
          </div>
        `
        )
        .join("");
    }

    function initAndRenderCalendar() {
      const yearSel = document.getElementById("calYearSelect");
      const monthSel = document.getElementById("calMonthSelect");

      if (yearSel.options.length === 0) {
        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 2; y <= currentYear + 3; y++) {
          const opt = document.createElement("option");
          opt.value = y;
          opt.textContent = y;
          yearSel.appendChild(opt);
        }
      }

      if (monthSel.options.length === 0) {
        MONTHS.forEach((m, idx) => {
          const opt = document.createElement("option");
          opt.value = String(idx + 1).padStart(2, "0");
          opt.textContent = m;
          monthSel.appendChild(opt);
        });
      }

      const parts = (selectedCalendarDate || getTodayISO()).split("-");
      yearSel.value = parts[0];
      monthSel.value = parts[1];

      renderCalendar();
    }

    function renderCalendar() {
      const year = parseInt(document.getElementById("calYearSelect").value, 10);
      const month = parseInt(document.getElementById("calMonthSelect").value, 10);
      const grid = document.getElementById("calendarGrid");

      const firstDayIndex = new Date(year, month - 1, 1).getDay();
      const daysInMonth = new Date(year, month, 0).getDate();

      const listDatesSet = new Set(lists.map((l) => l.date));
      const dows = ["S", "M", "T", "W", "T", "F", "S"];

      let html = dows.map((d) => `<div class="cal-dow">${d}</div>`).join("");

      for (let i = 0; i < firstDayIndex; i++) {
        html += `<div class="cal-day empty"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const isSelected = iso === selectedCalendarDate;
        const hasList = listDatesSet.has(iso);
        html += `
          <div class="cal-day ${isSelected ? "selected" : ""} ${hasList ? "has-list" : ""}" onclick="selectCalendarDate('${iso}')">
            ${day}
          </div>
        `;
      }

      grid.innerHTML = html;
      renderCalendarDateLists();
    }

    function selectCalendarDate(iso) {
      selectedCalendarDate = iso;
      renderCalendar();
    }

    function renderCalendarDateLists() {
      const label = document.getElementById("selectedDateLabel");
      const container = document.getElementById("calendarDateListsContainer");
      label.textContent = `Lists on ${formatFullDate(selectedCalendarDate)}`;

      const dayLists = lists.filter((l) => l.date === selectedCalendarDate);

      if (dayLists.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding:20px;">
            <div class="empty-title" style="font-size:14px;">No list for this date</div>
          </div>
        `;
        return;
      }

      container.innerHTML = dayLists
        .map(
          (l) => `
          <div class="group-card" style="background-color:var(--pastel-mint); border-color:var(--pastel-mint-border);" onclick="openListDetail('${l.id}')">
            <div style="font-size:14px; font-weight:700;">${escapeHTML(l.name)}</div>
            <span style="font-size:12px;">${l.items.length} items</span>
          </div>
        `
        )
        .join("");
    }

    function openListDetail(id) {
      activeListId = id;
      switchTab("detail");
    }

    function goBackFromDetail() {
      switchTab(previousTab || "all");
    }

    function renderDetailView() {
      const list = lists.find((l) => l.id === activeListId);
      if (!list) {
        switchTab("all");
        return;
      }

      document.getElementById("detailListTitle").textContent = list.name;
      document.getElementById("detailListDate").textContent = `Date: ${formatFullDate(list.date)}`;
      document.getElementById("detailNewItemName").value = "";
      document.getElementById("detailNewItemQty").value = "";

      const incomplete = list.items.filter((i) => !i.completed);
      const complete = list.items.filter((i) => i.completed);

      const incBox = document.getElementById("detailIncompleteContainer");
      const compBox = document.getElementById("detailCompleteContainer");

      incBox.innerHTML =
        incomplete.length === 0
          ? `<div style="font-size:12px; color:var(--text-muted); padding:6px 2px;">No incomplete items.</div>`
          : incomplete.map((item) => renderTaskRow(list.id, item)).join("");

      compBox.innerHTML =
        complete.length === 0
          ? `<div style="font-size:12px; color:var(--text-muted); padding:6px 2px;">No completed items yet.</div>`
          : complete.map((item) => renderTaskRow(list.id, item)).join("");
    }

    function renderTaskRow(listId, item) {
      return `
        <div class="task-item ${item.completed ? "completed-item" : ""}">
          <div class="task-left">
            <input
              type="checkbox"
              class="task-checkbox"
              ${item.completed ? "checked" : ""}
              onchange="toggleItemComplete('${listId}', '${item.id}')"
            />
            <span class="task-name">${escapeHTML(item.name)}</span>
          </div>
          ${item.qty ? `<span class="task-qty">${escapeHTML(item.qty)}</span>` : ""}
        </div>
      `;
    }

    function addItemToCurrentList(e) {
      e.preventDefault();
      const list = lists.find((l) => l.id === activeListId);
      if (!list) return;

      const nameInput = document.getElementById("detailNewItemName");
      const qtyInput = document.getElementById("detailNewItemQty");
      const name = nameInput.value.trim();
      const qty = qtyInput.value.trim();

      if (!name) return;

      list.items.push({
        id: "item_" + Date.now(),
        name,
        qty,
        completed: false
      });

      saveLists();
      renderDetailView();
    }

    function toggleItemComplete(listId, itemId) {
      const list = lists.find((l) => l.id === listId);
      if (!list) return;
      const item = list.items.find((i) => i.id === itemId);
      if (!item) return;

      item.completed = !item.completed;
      saveLists();
      renderDetailView();
    }

    function deleteCurrentList() {
      if (!activeListId) return;
      lists = lists.filter((l) => l.id !== activeListId);
      activeListId = null;
      saveLists();
      switchTab("all");
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Initialize App
    loadLists();
    setTodayLabels();
    renderAllLists();
  </script>
</body>
</html>
